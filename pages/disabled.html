<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account disabilitato</title>
  <link rel="stylesheet" href="../media/index.css">
</head>
<body class="disabled-page">
  <div class="disabled-shell">
    <div class="disabled-card">
      <div class="disabled-icon" aria-hidden="true">🔒</div>
      <h1>Account disabilitato</h1>
      <p>Il tuo account è stato temporaneamente disabilitato.</p>
      <p>Se pensi si tratti di un errore, contatta il supporto.</p>

      <div class="disabled-actions">
        <a class="disabled-link" href="mailto:support@mattedev.com">Contatta il supporto</a>
        <button class="disabled-logout" onclick="logout()">Esci dall'account</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7Tbqt5FzJK8Z_USkCMWxXiHZp8uRN26A",
      authDomain: "mattedev-account.firebaseapp.com",
      databaseURL: "https://mattedev-account-default-rtdb.firebaseio.com",
      projectId: "mattedev-account",
      storageBucket: "mattedev-account.firebasestorage.app",
      messagingSenderId: "77268069903",
      appId: "1:77268069903:web:040aa6c3981eb3650afd7a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.logout = async () => {
      await signOut(auth);
      window.location.replace("/pages/login.html");
    };
  </script>
</body>
</html>
